services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
    container_name: citycanvas-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      AMAP_REST_KEY: ${AMAP_REST_KEY}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL}
      AI_GATEWAY_API_STYLE: ${AI_GATEWAY_API_STYLE:-anthropic}
      AI_GATEWAY_MODELS: ${AI_GATEWAY_MODELS:-}
    volumes:
      - citycanvas-data:/app/data
    expose:
      - "3000"
    networks:
      - citycanvas-net
    # 首次启动自动建表（幂等），失败立即退出便于日志排查，由 restart 拉起重试
    command: >
      sh -c "
      prisma db push --schema=./prisma/schema.prisma --skip-generate &&
      node server.js
      "

  nginx:
    image: nginx:alpine
    container_name: citycanvas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - citycanvas-net

volumes:
  citycanvas-data:

networks:
  citycanvas-net:
    driver: bridge
