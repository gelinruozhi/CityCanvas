services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citycanvas-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY}
      NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE}
      AMAP_REST_KEY: ${AMAP_REST_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
    volumes:
      - citycanvas-data:/app/data
    expose:
      - "3000"
    networks:
      - citycanvas-net
    # 容器启动前自动 push prisma schema（首次启动建表）
    command: >
      sh -c "
      pnpm prisma db push --schema=./prisma/schema.prisma --accept-data-loss=false 2>/dev/null || npx prisma db push --schema=./prisma/schema.prisma 2>/dev/null || true;
      node server.js
      "

  nginx:
    image: nginx:alpine
    container_name: citycanvas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - citycanvas-net

volumes:
  citycanvas-data:

networks:
  citycanvas-net:
    driver: bridge
